[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = "-q --strict-markers"
markers = [
    "unit: fast, isolated tests with no external infrastructure",
    "slow: tests that take a long time to execute",
]

[tool.coverage.run]
branch = true
source = ["image_quality"]
