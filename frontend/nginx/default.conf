# Production reverse proxy for the MVP (08_infrastructure.md Sections 2.4,
# 3.1, 8.2 and 8.3).
#
# One nginx process serves the optimized React build, terminates TLS and
# proxies /api/ and /health/ to the FastAPI service. Only this container is
# published by compose.prod.yaml; the API, PostgreSQL, Redis and the workers
# have no host ports.
#
# Certificates are mounted read-only at /etc/nginx/certs (tls.crt + tls.key).
# They are never baked into the image. See docs/deployment.md.

# Do not send HSTS for localhost/127.0.0.1: it would force the development
# Vite server (http://localhost:5173) to HTTPS in the same browser profile.
map $host $hsts_header {
    default          "max-age=31536000; includeSubDomains";
    localhost        "";
    "~^127\."        "";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Everything except the ACME HTTP-01 path is redirected to HTTPS.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /usr/share/nginx/html;
    index index.html;

    # Matches MAX_UPLOAD_SIZE_MB (20) with headroom for multipart overhead.
    client_max_body_size 25m;
    client_body_timeout  120s;

    add_header Strict-Transport-Security $hsts_header always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A tiny endpoint for the container health check. It never touches the API.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API documentation is disabled in production (ENABLE_API_DOCS=false).
    # Answer explicitly instead of letting the SPA fallback hide the path.
    location = /docs {
        return 404;
    }

    location = /openapi.json {
        return 404;
    }

    # Docker's embedded DNS re-resolves the API after a container restart; a
    # literal `proxy_pass http://api:8000` would cache the first address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend "api:8000";

    location /api/ {
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, do not append: the API trusts these headers for the rate
        # limiter, so a client-supplied X-Forwarded-For must not survive.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # Operational health endpoints are reachable through the same origin so a
    # deployment check never needs the API port.
    location /health/ {
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Vite emits content-hashed asset names, so they are immutable.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Client-side routes (/dashboard, /projects/{id}, ...) fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
