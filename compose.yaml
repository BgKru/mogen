# ---------------------------------------------------------------------------
# 3D generation web application - Docker Compose
#
# See docs/specifications/08_infrastructure.md, Section 5.
#
# Validate:  docker compose config
# Start:     docker compose up -d --build
# ---------------------------------------------------------------------------

name: mogen

x-backend-build: &backend-build
  context: ./backend
  target: development

# The object worker deliberately uses a different image: it carries PyTorch,
# TripoSR and torchmcubes, which the API must not contain
# (08_infrastructure.md Sections 3.5 and 4.3).
x-object-worker-build: &object-worker-build
  context: .
  dockerfile: ml/object_generation/Dockerfile
  target: development

# The scene worker is a third image: COLMAP 4.2.1 (CUDA-enabled), OpenMVS 2.4.0
# and their native dependencies must not reach the API or object worker
# (08_infrastructure.md Sections 3.6 and 4.4).
x-scene-worker-build: &scene-worker-build
  context: .
  dockerfile: ml/scene_reconstruction/Dockerfile
  target: development

services:
  db:
    # PostgreSQL 17.11, verified in Phase 1. Digest pin: update deliberately.
    image: postgres:17@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - internal

  redis:
    # Redis 7.4.12, verified in Phase 1. Digest pin: update deliberately.
    image: redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - internal

  migration:
    build: *backend-build
    image: mogen-api:dev
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:change_me@db:5432/app}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  api:
    build: *backend-build
    image: mogen-api:dev
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:change_me@db:5432/app}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      CSRF_SECRET: ${CSRF_SECRET:-dev-only-csrf-secret-change-before-production}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}
      PASSWORD_MAX_LENGTH: ${PASSWORD_MAX_LENGTH:-128}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
      MAX_IMAGE_DIMENSION: ${MAX_IMAGE_DIMENSION:-8192}
      MIN_SCENE_IMAGES: ${MIN_SCENE_IMAGES:-3}
      MAX_SCENE_IMAGES: ${MAX_SCENE_IMAGES:-100}
      MAX_PAGE_SIZE: ${MAX_PAGE_SIZE:-100}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - app_data:/data
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - internal

  cleanup-worker:
    build: *backend-build
    image: mogen-api:dev
    restart: unless-stopped
    # The beat scheduler lives in this container for development. Production
    # separates beat from the worker (08_infrastructure.md Section 7).
    command:
      - celery
      - -A
      - app.tasks.celery_app:celery_app
      - worker
      - -Q
      - file_cleanup
      - --concurrency=${CLEANUP_WORKER_CONCURRENCY:-2}
      - --prefetch-multiplier=1
      - --beat
      - --schedule=/tmp/celerybeat-schedule
      - --loglevel=${LOG_LEVEL:-INFO}
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:change_me@db:5432/app}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_TASK_IGNORE_RESULT: ${CELERY_TASK_IGNORE_RESULT:-true}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data}
      CLEANUP_BATCH_SIZE: ${CLEANUP_BATCH_SIZE:-20}
      CLEANUP_POLL_INTERVAL_SECONDS: ${CLEANUP_POLL_INTERVAL_SECONDS:-15}
      CLEANUP_MAX_ATTEMPTS: ${CLEANUP_MAX_ATTEMPTS:-3}
      CLEANUP_TASK_TIME_LIMIT_SECONDS: ${CLEANUP_TASK_TIME_LIMIT_SECONDS:-600}
      # Scene workspace retention sweep (07 Section 15.7): the cleanup worker
      # prunes terminal scene workspaces and reports temporary storage usage.
      SCENE_WORK_DIR: ${SCENE_WORK_DIR:-/data/work/scene}
      SCENE_WORKSPACE_RETENTION_HOURS: ${SCENE_WORKSPACE_RETENTION_HOURS:-168}
      SCENE_WORKSPACE_SWEEP_INTERVAL_SECONDS: ${SCENE_WORKSPACE_SWEEP_INTERVAL_SECONDS:-3600}
    volumes:
      - app_data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      # A running process is not enough: the worker must answer on its queue.
      # CMD-SHELL is required so the container hostname can expand.
      test:
        - CMD-SHELL
        - >-
          celery -A app.tasks.celery_app:celery_app inspect ping
          -d celery@$$HOSTNAME --timeout 5
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s
    networks:
      - internal

  model-init:
    build: *object-worker-build
    image: mogen-object-worker:dev
    # One-shot controlled initialization: downloads the pinned TripoSR weights,
    # the DINO config and the rembg model into the persistent cache. No task
    # execution ever downloads anything (06_object_generation.md Section 4.5).
    restart: "no"
    command: ["python", "-m", "object_generation.download_models"]
    environment:
      OBJECT_MODEL_ID: ${OBJECT_MODEL_ID:-stabilityai/TripoSR}
      OBJECT_MODEL_REVISION: ${OBJECT_MODEL_REVISION:-5b521936b01fbe1890f6f9baed0254ab6351c04a}
      OBJECT_MODEL_DIR: ${OBJECT_MODEL_DIR:-/models/triposr}
      OBJECT_MODEL_SHA256: ${OBJECT_MODEL_SHA256:-429e2c6b22a0923967459de24d67f05962b235f79cde6b032aa7ed2ffcd970ee}
      OBJECT_DINO_MODEL_ID: ${OBJECT_DINO_MODEL_ID:-facebook/dino-vitb16}
      OBJECT_DINO_REVISION: ${OBJECT_DINO_REVISION:-f205d5d8e640a89a2b8ef0369670dfc37cc07fc2}
      OBJECT_REMBG_MODEL: ${OBJECT_REMBG_MODEL:-u2net}
      HF_HOME: /models/hf
      U2NET_HOME: /models/u2net
      PYTHONPATH: /app:/opt/triposr:/opt
    volumes:
      - triposr_model_cache:/models
    networks:
      - internal

  object-worker:
    build: *object-worker-build
    image: mogen-object-worker:dev
    restart: unless-stopped
    # `--pool=solo` keeps one process per GPU: the model is loaded once and is
    # never forked, which is what CUDA requires. `--include` is what imports
    # app/tasks/object_pipeline.py and therefore registers the TripoSR pipeline
    # through the Phase 4 `register_pipeline` hook.
    command:
      - celery
      - -A
      - app.tasks.celery_app:celery_app
      - worker
      - -Q
      - object_generation
      - --pool=solo
      - --include=app.tasks.object_pipeline
      - --loglevel=${LOG_LEVEL:-INFO}
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_SERVICE_NAME: object-worker
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:change_me@db:5432/app}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_TASK_IGNORE_RESULT: ${CELERY_TASK_IGNORE_RESULT:-true}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data}
      TASK_LEASE_SECONDS: ${TASK_LEASE_SECONDS:-300}
      TASK_HEARTBEAT_SECONDS: ${TASK_HEARTBEAT_SECONDS:-30}
      OBJECT_TASK_TIME_LIMIT_SECONDS: ${OBJECT_TASK_TIME_LIMIT_SECONDS:-3600}
      # CPU-only default for the base file; compose.gpu.yaml forces cuda:0.
      OBJECT_GENERATION_ENABLED: ${OBJECT_GENERATION_ENABLED:-true}
      OBJECT_MODEL_ID: ${OBJECT_MODEL_ID:-stabilityai/TripoSR}
      OBJECT_MODEL_REVISION: ${OBJECT_MODEL_REVISION:-5b521936b01fbe1890f6f9baed0254ab6351c04a}
      OBJECT_MODEL_DIR: ${OBJECT_MODEL_DIR:-/models/triposr}
      OBJECT_MODEL_SHA256: ${OBJECT_MODEL_SHA256:-429e2c6b22a0923967459de24d67f05962b235f79cde6b032aa7ed2ffcd970ee}
      OBJECT_DINO_MODEL_ID: ${OBJECT_DINO_MODEL_ID:-facebook/dino-vitb16}
      OBJECT_DINO_REVISION: ${OBJECT_DINO_REVISION:-f205d5d8e640a89a2b8ef0369670dfc37cc07fc2}
      OBJECT_DEVICE: ${OBJECT_DEVICE:-cpu}
      OBJECT_ALLOW_CPU_FALLBACK: ${OBJECT_ALLOW_CPU_FALLBACK:-true}
      OBJECT_CHUNK_SIZE: ${OBJECT_CHUNK_SIZE:-8192}
      OBJECT_MC_RESOLUTION: ${OBJECT_MC_RESOLUTION:-256}
      OBJECT_REMOVE_BACKGROUND: ${OBJECT_REMOVE_BACKGROUND:-true}
      OBJECT_FOREGROUND_RATIO: ${OBJECT_FOREGROUND_RATIO:-0.85}
      OBJECT_OUTPUT_FORMAT: ${OBJECT_OUTPUT_FORMAT:-glb}
      OBJECT_BAKE_TEXTURE: ${OBJECT_BAKE_TEXTURE:-false}
      OBJECT_TEXTURE_RESOLUTION: ${OBJECT_TEXTURE_RESOLUTION:-2048}
      OBJECT_MAX_TASK_SECONDS: ${OBJECT_MAX_TASK_SECONDS:-900}
      OBJECT_WORKER_CONCURRENCY: ${OBJECT_WORKER_CONCURRENCY:-1}
      OBJECT_REMBG_MODEL: ${OBJECT_REMBG_MODEL:-u2net}
      OBJECT_INPUT_SIZE: ${OBJECT_INPUT_SIZE:-512}
      OBJECT_WORK_DIR: ${OBJECT_WORK_DIR:-/tmp/mogen-object-generation}
      HF_HOME: /models/hf
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      U2NET_HOME: /models/u2net
      PYTHONPATH: /app:/opt/triposr:/opt
    volumes:
      - app_data:/data
      - triposr_model_cache:/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      model-init:
        condition: service_completed_successfully
    healthcheck:
      # The model is loaded during worker startup, so the start period is
      # deliberately generous. A ping proves the worker answers on its queue.
      test:
        - CMD-SHELL
        - >-
          celery -A app.tasks.celery_app:celery_app inspect ping
          -d celery@$$HOSTNAME --timeout 10
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 600s
    networks:
      - internal

  scene-worker:
    build: *scene-worker-build
    image: mogen-scene-worker:dev
    restart: unless-stopped
    # Dedicated COLMAP/OpenMVS image. `--include` imports
    # app/tasks/scene_pipeline.py, which verifies the external executables and
    # registers the pipeline through the Phase 4 `register_pipeline` hook.
    command:
      - celery
      - -A
      - app.tasks.celery_app:celery_app
      - worker
      - -Q
      - scene_reconstruction
      - --concurrency=${SCENE_WORKER_CONCURRENCY:-1}
      - --prefetch-multiplier=1
      - --include=app.tasks.scene_pipeline
      - --loglevel=${LOG_LEVEL:-INFO}
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_SERVICE_NAME: scene-worker
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:change_me@db:5432/app}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_TASK_IGNORE_RESULT: ${CELERY_TASK_IGNORE_RESULT:-true}
      STORAGE_ROOT: ${STORAGE_ROOT:-/data}
      TASK_LEASE_SECONDS: ${TASK_LEASE_SECONDS:-300}
      TASK_HEARTBEAT_SECONDS: ${TASK_HEARTBEAT_SECONDS:-30}
      SCENE_TASK_TIME_LIMIT_SECONDS: ${SCENE_TASK_TIME_LIMIT_SECONDS:-7200}
      SCENE_RECONSTRUCTION_ENABLED: ${SCENE_RECONSTRUCTION_ENABLED:-true}
      SCENE_COLMAP_EXECUTABLE: ${SCENE_COLMAP_EXECUTABLE:-/usr/local/bin/colmap}
      SCENE_OPENMVS_BIN_DIR: ${SCENE_OPENMVS_BIN_DIR:-/usr/local/bin/OpenMVS}
      SCENE_WORK_DIR: ${SCENE_WORK_DIR:-/data/work/scene}
      # CPU default for the base file; compose.gpu.yaml forces GPU COLMAP.
      SCENE_COLMAP_USE_GPU: ${SCENE_COLMAP_USE_GPU:-false}
      SCENE_MATCHING_STRATEGY: ${SCENE_MATCHING_STRATEGY:-EXHAUSTIVE}
      SCENE_COLMAP_MAX_FEATURES: ${SCENE_COLMAP_MAX_FEATURES:-8192}
      SCENE_COLMAP_CAMERA_MODEL: ${SCENE_COLMAP_CAMERA_MODEL:-SIMPLE_RADIAL}
      SCENE_MAX_IMAGE_SIZE: ${SCENE_MAX_IMAGE_SIZE:-2000}
      SCENE_MAX_THREADS: ${SCENE_MAX_THREADS:-4}
      SCENE_OPENMVS_USE_CUDA: ${SCENE_OPENMVS_USE_CUDA:-false}
      SCENE_ENABLE_MESH_REFINEMENT: ${SCENE_ENABLE_MESH_REFINEMENT:-true}
      SCENE_ENABLE_TEXTURE_GENERATION: ${SCENE_ENABLE_TEXTURE_GENERATION:-true}
      SCENE_MIN_REGISTERED_IMAGES: ${SCENE_MIN_REGISTERED_IMAGES:-3}
      SCENE_MIN_REGISTRATION_RATIO: ${SCENE_MIN_REGISTRATION_RATIO:-0.5}
      SCENE_MIN_SPARSE_POINTS: ${SCENE_MIN_SPARSE_POINTS:-100}
      SCENE_MIN_DENSE_POINTS: ${SCENE_MIN_DENSE_POINTS:-100}
      SCENE_MAX_TASK_SECONDS: ${SCENE_MAX_TASK_SECONDS:-14400}
      SCENE_COLMAP_TIMEOUT_SECONDS: ${SCENE_COLMAP_TIMEOUT_SECONDS:-3600}
      SCENE_OPENMVS_TIMEOUT_SECONDS: ${SCENE_OPENMVS_TIMEOUT_SECONDS:-5400}
      SCENE_EXPORT_TIMEOUT_SECONDS: ${SCENE_EXPORT_TIMEOUT_SECONDS:-1800}
      SCENE_OUTPUT_FORMAT: ${SCENE_OUTPUT_FORMAT:-GLB}
    volumes:
      - app_data:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      # A ping proves the worker answers on the scene queue after the startup
      # toolchain check; the image build already proved the binaries start.
      test:
        - CMD-SHELL
        - >-
          celery -A app.tasks.celery_app:celery_app inspect ping
          -d celery@$$HOSTNAME --timeout 10
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    networks:
      - internal

  outbox-dispatcher:
    build: *backend-build
    image: mogen-api:dev
    restart: unless-stopped
    # Independent process: it never serves HTTP and never publishes Redis
    # state as the source of truth (08 Sections 3.9 and 7.6).
    command: ["python", "-m", "app.tasks.outbox_dispatcher"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:change_me@db:5432/app}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_TASK_IGNORE_RESULT: ${CELERY_TASK_IGNORE_RESULT:-true}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-2}
      OUTBOX_RETRY_BASE_SECONDS: ${OUTBOX_RETRY_BASE_SECONDS:-2}
      OUTBOX_RETRY_MAX_SECONDS: ${OUTBOX_RETRY_MAX_SECONDS:-300}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}
      OUTBOX_LOCK_TIMEOUT_SECONDS: ${OUTBOX_LOCK_TIMEOUT_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      # Proves the poll loop completed a recent cycle, not merely that a
      # process exists; the loop writes the file after every attempt.
      test:
        - CMD
        - python
        - -c
        - >-
          import os, sys, time;
          path = '/tmp/outbox-dispatcher.heartbeat';
          sys.exit(0 if os.path.exists(path)
          and time.time() - os.path.getmtime(path) < 120 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - internal

  task-recovery:
    build: *backend-build
    image: mogen-api:dev
    restart: unless-stopped
    # Independent recovery process; it creates outbox events and never
    # publishes to Redis itself (08 Sections 3.10 and 9).
    command: ["python", "-m", "app.tasks.task_recovery"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:change_me@db:5432/app}
      TASK_LEASE_SECONDS: ${TASK_LEASE_SECONDS:-300}
      TASK_HEARTBEAT_SECONDS: ${TASK_HEARTBEAT_SECONDS:-30}
      TASK_STALE_THRESHOLD_SECONDS: ${TASK_STALE_THRESHOLD_SECONDS:-900}
      DISPATCH_STALL_TIMEOUT_SECONDS: ${DISPATCH_STALL_TIMEOUT_SECONDS:-900}
      TASK_RECOVERY_MAX_ATTEMPTS: ${TASK_RECOVERY_MAX_ATTEMPTS:-3}
      RECOVERY_BATCH_SIZE: ${RECOVERY_BATCH_SIZE:-50}
      RECOVERY_POLL_INTERVAL_SECONDS: ${RECOVERY_POLL_INTERVAL_SECONDS:-30}
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, sys, time;
          path = '/tmp/task-recovery.heartbeat';
          sys.exit(0 if os.path.exists(path)
          and time.time() - os.path.getmtime(path) < 120 else 1)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      target: development
    image: mogen-frontend:dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      # Inside the network the API is reached by service name, not localhost.
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://api:8000}
      VITE_TASK_POLL_INTERVAL: ${VITE_TASK_POLL_INTERVAL:-3000}
      VITE_MAX_UPLOAD_SIZE_MB: ${VITE_MAX_UPLOAD_SIZE_MB:-20}
      VITE_MIN_SCENE_IMAGES: ${VITE_MIN_SCENE_IMAGES:-3}
      VITE_MAX_SCENE_IMAGES: ${VITE_MAX_SCENE_IMAGES:-100}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  app_data:
  # Declared ahead of use. Compose omits named volumes that no service mounts
  # yet, so this appears in `docker compose config` once the workers exist.
  triposr_model_cache:

networks:
  internal:
    driver: bridge
