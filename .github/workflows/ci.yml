# CI quality gate (TEST-AC-19).
#
# Fast checks run on every push and pull request: backend lint, formatting,
# migration validation and the full pytest suite against real PostgreSQL and
# Redis; frontend lint, type checking, formatting, unit tests with coverage and
# a production build; Compose configuration validation.
#
# Resource-intensive verification lives in separate workflows:
#   * e2e.yml            — browser workflows (hosted smoke, self-hosted real ML)
#   * ml-validation.yml  — real TripoSR and COLMAP/OpenMVS validation
name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, migrations, tests, coverage)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://app:change_me@localhost:5432/app
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Migration validation
        run: |
          alembic upgrade head
          alembic check

      - name: Dependency consistency
        run: pip check

      - name: Tests with coverage
        run: >-
          pytest --cov=app --cov-report=term-missing
          --cov-report=xml:coverage.xml --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error

  frontend:
    name: Frontend (lint, types, format, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: error

  infrastructure:
    name: Compose and production image configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the development stack definition
        run: docker compose -f compose.yaml -f compose.gpu.yaml config -q

      - name: Validate the production overlay definition
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-password
          CSRF_SECRET: ci-only-csrf-secret-at-least-32-characters-long
          PUBLIC_ORIGIN: https://localhost
        run: >-
          docker compose -f compose.yaml -f compose.prod.yaml
          -f compose.gpu.yaml config -q

      - name: Build the production frontend image (nginx stage)
        run: docker build -f frontend/Dockerfile --target production -t mogen-frontend:ci frontend

      - name: Validate the nginx configuration
        run: |
          mkdir -p /tmp/mogen-certs
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout /tmp/mogen-certs/tls.key -out /tmp/mogen-certs/tls.crt \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          docker run --rm -v /tmp/mogen-certs:/etc/nginx/certs:ro \
            --entrypoint nginx mogen-frontend:ci -t

      - name: Build the backup image
        run: docker build -t mogen-backup:ci infrastructure/backup
